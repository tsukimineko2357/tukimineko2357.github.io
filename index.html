<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HumMelody - 鼻歌作曲アプリ</title>
  <style>
    body {
      margin: 0; padding: 10px; background: #222; color: #fff;
      font-family: sans-serif; text-align: center;
      height: 100vh; box-sizing: border-box;
      display: flex; flex-direction: column; overflow: hidden;
      user-select: none; -webkit-user-select: none;
    }
    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin: 5px 10px 10px 10px; flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 15px; }
    h1 { font-size: 20px; margin: 0; color: #10b981; letter-spacing: 1px; }
    
    .tool-group {
      display: flex; gap: 4px; align-items: center;
      background: #333; padding: 4px; border-radius: 8px;
    }
    .tool-btn {
      width: 38px; height: 38px; font-size: 18px;
      background: transparent; color: #fff; border: none; border-radius: 6px;
      cursor: pointer; transition: 0.1s; display: flex; align-items: center; justify-content: center;
    }
    .tool-btn:hover { background: #4b5563; }
    .tool-btn:active { transform: scale(0.95); }
    .tool-btn.active { background: #3b82f6; box-shadow: 0 0 6px rgba(59, 130, 246, 0.6); }
    .divider { width: 1px; height: 24px; background: #555; margin: 0 2px; }

    select {
      padding: 6px 12px; font-size: 14px; font-weight: bold; background: #444;
      color: #fff; border: 1px solid #666; border-radius: 6px; cursor: pointer;
    }
    canvas {
      background: #111; border: 2px solid #444; border-radius: 8px;
      display: block; margin: 0 auto 15px auto; width: 100%; flex-grow: 1;
      touch-action: none; cursor: crosshair;
    }
    #status {
      font-size: 16px; margin: 0 0 10px 0; height: 20px;
      font-weight: bold; color: #60a5fa; flex-shrink: 0;
    }
    #controls {
      margin: 0 0 10px 0; display: flex; justify-content: center; gap: 8px;
      flex-wrap: wrap; flex-shrink: 0;
    }
    button.control-btn {
      padding: 10px 20px; font-size: 15px; font-weight: bold; background: #10b981;
      color: white; border: none; border-radius: 20px; cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    button.recording { background: #ef4444 !important; }
    #playBtn { background: #3b82f6; width: 120px; }
    #stopBtn { background: #6b7280; }

    .context-menu {
      display: none; position: absolute; background: #2a2a2a; border: 1px solid #555;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6); border-radius: 6px; z-index: 1000;
      padding: 5px 0; user-select: none;
    }
    .menu-item { padding: 10px 25px; cursor: pointer; font-size: 14px; color: #fff; text-align: left; }
    .menu-item:hover { background: #3b82f6; }
    .menu-item.disabled { color: #666; pointer-events: none; }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="header-left">
      <h1>HumMelody</h1>
      <div class="tool-group">
        <button id="undoBtn" class="tool-btn" title="元に戻す (Ctrl+Z)">↩</button>
        <button id="redoBtn" class="tool-btn" title="やり直す (Ctrl+Y)">↪</button>
        <div class="divider"></div>
        <button id="modeSelect" class="tool-btn active" title="選択・移動">👆</button>
        <button id="modePen" class="tool-btn" title="ペンで作成">✏️</button>
      </div>
    </div>
    
    <select id="dataFileSelect">
      <option value="slot1">ファイル 1</option>
      <option value="slot2">ファイル 2</option>
      <option value="slot3">ファイル 3</option>
    </select>
  </div>
  
  <canvas id="monitorCanvas" oncontextmenu="return false;"></canvas>

  <div id="status">ボタンを押して歌ってください</div>
  <div id="controls">
    <button id="recordBtn" class="control-btn">録音開始</button>
    <button id="playBtn" class="control-btn">▶ 再生</button>
    <button id="stopBtn" class="control-btn">⏹ 停止</button>
  </div>

  <div id="contextMenu" class="context-menu">
    <div class="menu-item" id="menuCut">✂ カット</div>
    <div class="menu-item" id="menuCopy">📋 コピー</div>
    <div class="menu-item" id="menuPaste">📝 ペースト</div>
    <div class="menu-item" id="menuDelete">🗑 削除</div>
  </div>
  
  <script>
    const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    function hzToNote(frequency) {
      if (!frequency || frequency <= 0) return null;
      const noteNum = 12 * (Math.log(frequency / 440) / Math.log(2)) + 69;
      const rounded = Math.round(noteNum);
      const name = NOTE_NAMES[rounded % 12];
      const octave = Math.floor(rounded / 12) - 1;
      return { name: `${name}${octave}`, number: rounded };
    }

    function autoCorrelate(buffer, sampleRate) {
      const SIZE = buffer.length; let rms = 0;
      for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
      rms = Math.sqrt(rms / SIZE);
      if (rms < 0.03) return -1;
      let r1 = 0, r2 = SIZE - 1; const thres = 0.2;
      for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buffer[i]) < thres) { r1 = i; break; }
      for (let i = SIZE - 1; i >= SIZE / 2; i--) if (Math.abs(buffer[i]) < thres) { r2 = i; break; }
      const slicedBuffer = buffer.slice(r1, r2); const len = slicedBuffer.length;
      const c = new Float32Array(len);
      for (let i = 0; i < len; i++) for (let j = 0; j < len - i; j++) c[i] = c[i] + slicedBuffer[j] * slicedBuffer[j + i];
      let d = 0; while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < len / 2; i++) if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
      return sampleRate / maxpos;
    }

    const recordBtn = document.getElementById("recordBtn"); const playBtn = document.getElementById("playBtn"); const stopBtn = document.getElementById("stopBtn");
    const undoBtn = document.getElementById("undoBtn"); const redoBtn = document.getElementById("redoBtn");
    const statusDiv = document.getElementById("status"); const canvas = document.getElementById("monitorCanvas"); const ctx = canvas.getContext("2d");
    const dataFileSelect = document.getElementById("dataFileSelect"); const contextMenu = document.getElementById("contextMenu");
    
    let editMode = "select"; 
    const modeSelectBtn = document.getElementById("modeSelect"); const modePenBtn = document.getElementById("modePen");
    modeSelectBtn.addEventListener("click", () => { editMode = "select"; modeSelectBtn.classList.add("active"); modePenBtn.classList.remove("active"); canvas.style.cursor = "crosshair"; });
    modePenBtn.addEventListener("click", () => { editMode = "pen"; modePenBtn.classList.add("active"); modeSelectBtn.classList.remove("active"); canvas.style.cursor = "cell"; });

    const KEYBOARD_WIDTH = 40; const baseMinNote = 48; const baseMaxNote = 84; const noteRange = baseMaxNote - baseMinNote + 1; 
    const GRID_SIZE = 30; const SNAP_DIST = 6;   

    let audioCtx = null, analyser = null, isRecording = false, animationId = null;
    let savedData = { "slot1": [], "slot2": [], "slot3": [] }; let currentSlot = "slot1"; let historyData = []; let editableNotes = []; 
    let undoStack = []; let redoStack = []; let clipboardNotes = []; let contextMenuPos = { x: 0, y: 0 };
    
    let pitchBuffer = []; const SMOOTHING_FRAMES = 5; let lastValidPitchNote = null; 

    let isPlaying = false; let isPaused = false; let playStartTime = 0; let playheadX = 0; let recordingStartX = 0; let scheduledNodes = []; 
    let scrollX = 0; let scrollY = 0; let scaleY = 1.0; 
    let isPanning = false; let panStartX = 0; let panStartY = 0; let panStartScrollX = 0; let panStartScrollY = 0; let hasMoved = false; let clickButton = 0; 
    let isSelecting = false; let selectionStart = { x: 0, y: 0 }; let selectionEnd = { x: 0, y: 0 }; let selectedNotes = []; 
    let draggingNote = null; let dragOffsetX = 0; let lastTapTime = 0; let lastTappedNote = null; let hoveredNote = null; let initialNotesState = null; let isCreatingNote = false;

    let longPressTimer = null;
    let isLongPressTriggered = false;

    function loadData() {
      const stored = localStorage.getItem('composerAppSaves');
      if (stored) savedData = JSON.parse(stored);
      editableNotes = savedData[currentSlot] || [];
      const viewState = localStorage.getItem('composerViewState');
      if (viewState) { const state = JSON.parse(viewState); scrollX = state.x || 0; scrollY = state.y || 0; scaleY = state.scale || 1.0; }
    }
    function saveData() {
      savedData[currentSlot] = editableNotes; localStorage.setItem('composerAppSaves', JSON.stringify(savedData));
      localStorage.setItem('composerViewState', JSON.stringify({ x: scrollX, y: scrollY, scale: scaleY }));
    }
    function pushHistory() { undoStack.push(JSON.stringify(editableNotes)); redoStack = []; }

    window.addEventListener('beforeunload', saveData);
    dataFileSelect.addEventListener("change", (e) => {
      if (isRecording || isPlaying) stopPlayback();
      if (isRecording) { isRecording = false; recordBtn.textContent = "録音開始"; recordBtn.classList.remove("recording"); }
      saveData(); currentSlot = e.target.value; editableNotes = savedData[currentSlot] || []; 
      undoStack = []; redoStack = []; selectedNotes = []; playheadX = 0; historyData = []; draw();
    });

    function performUndo() { if (undoStack.length > 0) { redoStack.push(JSON.stringify(editableNotes)); editableNotes = JSON.parse(undoStack.pop()); selectedNotes = []; saveData(); draw(); } }
    function performRedo() { if (redoStack.length > 0) { undoStack.push(JSON.stringify(editableNotes)); editableNotes = JSON.parse(redoStack.pop()); selectedNotes = []; saveData(); draw(); } }
    undoBtn.addEventListener("click", performUndo); redoBtn.addEventListener("click", performRedo);

    window.addEventListener('keydown', (e) => {
      if (isRecording) return; 
      if (e.ctrlKey || e.metaKey) {
        if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); e.shiftKey ? performRedo() : performUndo(); } 
        else if (e.key === 'y' || e.key === 'Y') { e.preventDefault(); performRedo(); }
      }
      if (e.key === 'Backspace' || e.key === 'Delete') {
        if (selectedNotes.length > 0) { pushHistory(); editableNotes = editableNotes.filter(n => !selectedNotes.includes(n)); selectedNotes = []; saveData(); draw(); }
      }
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.ctrlKey || e.metaKey) scaleY = Math.max(0.3, Math.min(3.0, scaleY - e.deltaY * 0.005));
      else { scrollX = Math.max(0, scrollX + e.deltaX); scrollY -= e.deltaY; }
      const newRowHeight = (canvas.height / noteRange) * scaleY;
      const maxY = (127 - baseMinNote + 2) * newRowHeight - canvas.height; 
      const minY = -(baseMinNote + 1) * newRowHeight; 
      if (scrollY > maxY) scrollY = maxY; if (scrollY < minY) scrollY = minY;
      saveData(); draw();
    }, { passive: false });

    function showContextMenu(clientX, clientY, canvasX, canvasY) {
      contextMenuPos = { x: canvasX, y: canvasY };
      document.getElementById("menuCut").classList.toggle("disabled", selectedNotes.length === 0);
      document.getElementById("menuCopy").classList.toggle("disabled", selectedNotes.length === 0);
      document.getElementById("menuDelete").classList.toggle("disabled", selectedNotes.length === 0);
      document.getElementById("menuPaste").classList.toggle("disabled", clipboardNotes.length === 0);
      
      let drawX = clientX; let drawY = clientY;
      if (drawX + 120 > window.innerWidth) drawX = window.innerWidth - 130;
      if (drawY + 160 > window.innerHeight) drawY = window.innerHeight - 170;

      contextMenu.style.left = drawX + "px";
      contextMenu.style.top = drawY + "px";
      contextMenu.style.display = "block";
    }

    window.addEventListener("mousedown", (e) => { if (e.button !== 2 && !e.target.closest('#contextMenu')) contextMenu.style.display = "none"; });
    window.addEventListener("touchstart", (e) => { if (!e.target.closest('#contextMenu')) contextMenu.style.display = "none"; }, { passive: true });

    document.getElementById("menuCopy").addEventListener("click", () => {
      if (selectedNotes.length > 0) { const minX = Math.min(...selectedNotes.map(n => n.x)); clipboardNotes = selectedNotes.map(n => ({ ...n, offsetX: n.x - minX })); }
      contextMenu.style.display = "none";
    });
    document.getElementById("menuCut").addEventListener("click", () => {
      if (selectedNotes.length > 0) {
        pushHistory(); const minX = Math.min(...selectedNotes.map(n => n.x)); clipboardNotes = selectedNotes.map(n => ({ ...n, offsetX: n.x - minX }));
        editableNotes = editableNotes.filter(n => !selectedNotes.includes(n)); selectedNotes = []; saveData(); draw();
      }
      contextMenu.style.display = "none";
    });
    document.getElementById("menuDelete").addEventListener("click", () => {
      if (selectedNotes.length > 0) { pushHistory(); editableNotes = editableNotes.filter(n => !selectedNotes.includes(n)); selectedNotes = []; saveData(); draw(); }
      contextMenu.style.display = "none";
    });
    document.getElementById("menuPaste").addEventListener("click", () => {
      if (clipboardNotes.length > 0) {
        pushHistory();
        const rowHeight = (canvas.height / noteRange) * scaleY;
        const targetX = contextMenuPos.x - KEYBOARD_WIDTH + scrollX;
        const targetNoteNum = Math.floor((canvas.height - contextMenuPos.y + scrollY) / rowHeight) + baseMinNote;
        const originNoteNum = clipboardNotes[0].noteNumber; const deltaNoteNum = targetNoteNum - originNoteNum;
        const newNotes = clipboardNotes.map(n => ({ x: Math.max(0, targetX + n.offsetX), width: n.width, noteNumber: Math.max(0, Math.min(127, n.noteNumber + deltaNoteNum)) }));
        editableNotes.push(...newNotes); selectedNotes = newNotes; saveData(); draw();
      }
      contextMenu.style.display = "none";
    });

    function resizeCanvas() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; draw(); }
    window.addEventListener('resize', resizeCanvas); 
    function getLastNoteEnd() { let max = 0; editableNotes.forEach(n => { if (n.x + n.width > max) max = n.x + n.width; }); return max; }

    recordBtn.addEventListener("click", async () => {
      if (isPlaying) stopPlayback(); 
      if (isRecording) {
        isRecording = false; recordBtn.textContent = "録音開始"; recordBtn.classList.remove("recording"); statusDiv.textContent = "ブロックを指で動かせます"; 
        if (animationId) cancelAnimationFrame(animationId);
        pushHistory(); convertHistoryToNotes(); saveData(); draw(); 
      } else {
        try {
          if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); analyser = audioCtx.createAnalyser(); analyser.fftSize = 2048; }
          if (audioCtx.state === 'suspended') await audioCtx.resume();
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); const source = audioCtx.createMediaStreamSource(stream); source.connect(analyser);
          isRecording = true; recordBtn.textContent = "録音停止"; recordBtn.classList.add("recording"); statusDiv.textContent = "声を認識中..."; 
          recordingStartX = playheadX; historyData = []; pitchBuffer = []; lastValidPitchNote = null; hoveredNote = null; selectedNotes = []; update();
        } catch (err) { statusDiv.textContent = "マイクの許可が必要です"; }
      }
    });

    function update() {
      if (!isRecording) return;
      const buffer = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(buffer);
      const pitch = autoCorrelate(buffer, audioCtx.sampleRate); const note = hzToNote(pitch);
      let rawNoteNum = null;
      if (note && pitch > 80 && pitch < 1200) {
        rawNoteNum = note.number;
        if (lastValidPitchNote !== null && Math.abs(rawNoteNum - lastValidPitchNote) >= 10) rawNoteNum = lastValidPitchNote;
        lastValidPitchNote = rawNoteNum;
      } else lastValidPitchNote = null;

      pitchBuffer.push(rawNoteNum); if (pitchBuffer.length > SMOOTHING_FRAMES) pitchBuffer.shift(); 
      let counts = {}, modeNote = null, maxCount = 0;
      for (let i = 0; i < pitchBuffer.length; i++) {
        const n = pitchBuffer[i]; 
        if (n !== null) { 
            counts[n] = (counts[n] || 0) + 1; 
            // ★調整：重みを1.5に下げ、自然な音の切り替わりを許容する
            let weight = (historyData.length > 0 && n === historyData[historyData.length - 1]) ? 1.5 : 1; 
            if (counts[n] * weight > maxCount) { maxCount = counts[n] * weight; modeNote = n; } 
        }
      }
      if (pitchBuffer.filter(n => n === null).length > Math.floor(SMOOTHING_FRAMES / 2)) modeNote = null;
      
      if (modeNote !== null) { statusDiv.textContent = `音階: ${NOTE_NAMES[modeNote % 12] + (Math.floor(modeNote / 12) - 1)}`; historyData.push(modeNote); } 
      else { statusDiv.textContent = "録音中..."; historyData.push(null); }
      
      playheadX = recordingStartX + historyData.length;
      const maxCanvasHistory = canvas.width - KEYBOARD_WIDTH;
      if (playheadX - scrollX > maxCanvasHistory * 0.8) scrollX = playheadX - maxCanvasHistory * 0.8;
      if (playheadX - scrollX < 0) scrollX = Math.max(0, playheadX - maxCanvasHistory * 0.2);
      draw(); animationId = requestAnimationFrame(update);
    }

    function convertHistoryToNotes() {
      let tempNotes = []; let currentNote = null;
      for (let x = 0; x < historyData.length; x++) {
        const n = historyData[x];
        if (n !== null && n >= 0 && n <= 127) {
          if (!currentNote) currentNote = { x: recordingStartX + x, width: 1, noteNumber: n };
          else if (currentNote.noteNumber === n) currentNote.width++;
          else { tempNotes.push(currentNote); currentNote = { x: recordingStartX + x, width: 1, noteNumber: n }; }
        } else if (currentNote) { tempNotes.push(currentNote); currentNote = null; }
      }
      if (currentNote) tempNotes.push(currentNote); historyData = [];

      // ★調整：細かい音（スタッカートなど）も残すため、削除基準を「3フレーム未満（ノイズ）」だけに緩和
      let cleanedNotes = tempNotes.filter(n => n.width >= 3);
      
      for (let i = 0; i < cleanedNotes.length - 1; i++) {
          let cur = cleanedNotes[i]; let nxt = cleanedNotes[i+1];
          // ★調整：滑らかになりすぎないよう、わずかな隙間（2フレーム以下）だけを結合する
          if (nxt.x - (cur.x + cur.width) <= 2 && cur.noteNumber === nxt.noteNumber) {
              cur.width = (nxt.x + nxt.width) - cur.x; cleanedNotes.splice(i + 1, 1); i--; 
          }
      }
      editableNotes.push(...cleanedNotes);
    }

    // --- 再生 ---
    playBtn.addEventListener("click", async () => {
      if (isRecording || editableNotes.length === 0) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (isPlaying && !isPaused) { await audioCtx.suspend(); isPaused = true; playBtn.textContent = "▶ 再開"; statusDiv.textContent = "一時停止中"; return; }
      if (isPlaying && isPaused) { await audioCtx.resume(); isPaused = false; playBtn.textContent = "⏸ 一時停止"; statusDiv.textContent = "再生中..."; animatePlayback(); return; }
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      if (playheadX >= getLastNoteEnd() - 5) playheadX = 0;
      startPlaybackFrom(playheadX);
    });

    stopBtn.addEventListener("click", () => { stopPlayback(); playheadX = 0; scrollX = 0; draw(); });

    function stopPlayback() {
      isPlaying = false; isPaused = false; playBtn.textContent = "▶ 再生"; statusDiv.textContent = "停止";
      scheduledNodes.forEach(osc => { try { osc.stop(); osc.disconnect(); } catch(e){} }); scheduledNodes = [];
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); 
      if (animationId) cancelAnimationFrame(animationId);
    }

    function startPlaybackFrom(startX) {
      stopPlayback(); isPlaying = true; isPaused = false; playBtn.textContent = "⏸ 一時停止"; statusDiv.textContent = "再生中...";
      const FPS = 60; const now = audioCtx.currentTime; playStartTime = now - (startX / FPS); 
      editableNotes.forEach(note => {
        if (note.x + note.width <= startX) return; 
        const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
        osc.type = "triangle"; osc.frequency.value = 440 * Math.pow(2, (note.noteNumber - 69) / 12); osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        let startTime, duration;
        if (note.x < startX) { startTime = now; duration = Math.max(0.05, (note.x + note.width - startX) / FPS); } 
        else { startTime = now + ((note.x - startX) / FPS); duration = Math.max(0.05, note.width / FPS); }
        gainNode.gain.setValueAtTime(0, startTime); gainNode.gain.linearRampToValueAtTime(0.3, startTime + 0.02);
        gainNode.gain.setValueAtTime(0.3, startTime + duration - 0.02); gainNode.gain.linearRampToValueAtTime(0, startTime + duration);
        osc.start(startTime); osc.stop(startTime + duration); scheduledNodes.push(osc);
      });
      animatePlayback();
    }

    function animatePlayback() {
      if (!isPlaying || isPaused) return;
      playheadX = (audioCtx.currentTime - playStartTime) * 60; 
      const maxCanvasHistory = canvas.width - KEYBOARD_WIDTH;
      if (playheadX - scrollX > maxCanvasHistory * 0.8) scrollX = playheadX - maxCanvasHistory * 0.8;
      if (playheadX - scrollX < 0) scrollX = Math.max(0, playheadX - maxCanvasHistory * 0.2);
      if (playheadX > getLastNoteEnd() + 30) { stopPlayback(); playheadX = 0; draw(); return; }
      draw(); animationId = requestAnimationFrame(animatePlayback);
    }

    function getSnappedX(x) {
      const rem = x % GRID_SIZE;
      if (rem < SNAP_DIST) return x - rem; 
      if (GRID_SIZE - rem < SNAP_DIST) return x + (GRID_SIZE - rem); 
      return x;
    }

    // --- 描画 ---
    function draw() {
      const rowHeight = (canvas.height / noteRange) * scaleY; 
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 1;
      for (let n = 0; n <= 127; n++) {
        const y = canvas.height - (n - baseMinNote + 1) * rowHeight + scrollY;
        if (y < -rowHeight || y > canvas.height) continue;
        ctx.strokeStyle = [1, 3, 6, 8, 10].includes(n % 12) ? "#111" : "#333";
        ctx.beginPath(); ctx.moveTo(KEYBOARD_WIDTH, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      ctx.save();
      ctx.beginPath();
      ctx.rect(KEYBOARD_WIDTH, 0, canvas.width - KEYBOARD_WIDTH, canvas.height);
      ctx.clip(); 

      const startGrid = Math.floor(scrollX / GRID_SIZE);
      const endGrid = Math.ceil((scrollX + canvas.width - KEYBOARD_WIDTH) / GRID_SIZE);
      for (let i = startGrid; i <= endGrid; i++) {
        const x = KEYBOARD_WIDTH + i * GRID_SIZE - scrollX;
        if (x > KEYBOARD_WIDTH) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
          ctx.strokeStyle = (i % 4 === 0) ? "#666" : "#2a2a2a"; ctx.stroke();
        }
      }

      for (let i = 0; i < editableNotes.length; i++) {
        const note = editableNotes[i];
        const y = canvas.height - (note.noteNumber - baseMinNote + 1) * rowHeight + scrollY;
        const x = KEYBOARD_WIDTH + note.x - scrollX;
        if (x + note.width > KEYBOARD_WIDTH && x < canvas.width && y > -rowHeight && y < canvas.height) {
          if (selectedNotes.includes(note)) { ctx.fillStyle = "#8b5cf6"; ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 2; } 
          else { ctx.fillStyle = (note === hoveredNote) ? "#60a5fa" : "#3b82f6"; ctx.strokeStyle = "#1e3a8a"; ctx.lineWidth = 1; }
          ctx.fillRect(x, y, note.width, rowHeight); ctx.strokeRect(x, y, note.width, rowHeight);
        }
      }
      ctx.fillStyle = "#10b981"; 
      for (let i = 0; i < historyData.length; i++) {
        const n = historyData[i];
        if (n !== null && n >= 0 && n <= 127) {
          const y = canvas.height - (n - baseMinNote + 1) * rowHeight + scrollY;
          const x = KEYBOARD_WIDTH + recordingStartX + i - scrollX;
          if (x > KEYBOARD_WIDTH - 2 && x < canvas.width && y > -rowHeight && y < canvas.height) ctx.fillRect(x, y, 2, rowHeight);
        }
      }

      const drawX = KEYBOARD_WIDTH + playheadX - scrollX;
      if (drawX >= KEYBOARD_WIDTH && drawX <= canvas.width) {
        ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(drawX, 0); ctx.lineTo(drawX, canvas.height); ctx.stroke();
      }

      if (isSelecting) {
        ctx.fillStyle = "rgba(59, 130, 246, 0.2)"; ctx.strokeStyle = "rgba(59, 130, 246, 0.8)"; ctx.lineWidth = 1;
        const rx = Math.min(selectionStart.x, selectionEnd.x); const ry = Math.min(selectionStart.y, selectionEnd.y);
        const rw = Math.abs(selectionEnd.x - selectionStart.x); const rh = Math.abs(selectionEnd.y - selectionStart.y);
        ctx.fillRect(rx, ry, rw, rh); ctx.strokeRect(rx, ry, rw, rh);
      }

      if (hoveredNote && !isRecording && !isSelecting && !draggingNote) {
        const name = NOTE_NAMES[hoveredNote.noteNumber % 12] + (Math.floor(hoveredNote.noteNumber / 12) - 1);
        const tooltipX = KEYBOARD_WIDTH + hoveredNote.x - scrollX + (hoveredNote.width / 2);
        const tooltipY = canvas.height - (hoveredNote.noteNumber - baseMinNote + 1) * rowHeight + scrollY - 6;
        if (tooltipX > KEYBOARD_WIDTH && tooltipX < canvas.width && tooltipY > 0) {
          ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
          const textWidth = ctx.measureText(name).width; const boxWidth = textWidth + 10; const boxHeight = 16;
          ctx.fillStyle = "rgba(10, 10, 10, 0.9)"; ctx.strokeStyle = "#444"; ctx.lineWidth = 1;
          ctx.fillRect(tooltipX - boxWidth / 2, tooltipY - boxHeight, boxWidth, boxHeight);
          ctx.strokeRect(tooltipX - boxWidth / 2, tooltipY - boxHeight, boxWidth, boxHeight);
          ctx.fillStyle = "#fbbf24"; ctx.fillText(name, tooltipX, tooltipY - 2);
        }
      }
      ctx.restore();

      ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.font = "8px sans-serif";
      for (let n = 0; n <= 127; n++) {
        const y = canvas.height - (n - baseMinNote + 1) * rowHeight + scrollY;
        if (y < -rowHeight || y > canvas.height) continue;
        const isBlackKey = [1, 3, 6, 8, 10].includes(n % 12);
        ctx.fillStyle = isBlackKey ? "#222" : "#eee"; ctx.fillRect(0, Math.floor(y), KEYBOARD_WIDTH, Math.ceil(rowHeight));
      }
      ctx.strokeStyle = "#000"; ctx.lineWidth = 1; ctx.beginPath();
      for (let n = 0; n <= 127; n++) {
        const y = Math.round(canvas.height - (n - baseMinNote + 1) * rowHeight + scrollY) + 0.5;
        if (y > 0 && y < canvas.height) { ctx.moveTo(0, y); ctx.lineTo(KEYBOARD_WIDTH, y); }
      }
      ctx.stroke();
      for (let n = 0; n <= 127; n++) {
        const y = canvas.height - (n - baseMinNote + 1) * rowHeight + scrollY;
        if (y < -rowHeight || y > canvas.height) continue;
        const isBlackKey = [1, 3, 6, 8, 10].includes(n % 12);
        const octave = Math.floor(n / 12) - 1; const name = NOTE_NAMES[n % 12] + octave;
        ctx.fillStyle = isBlackKey ? "#fff" : "#000"; ctx.fillText(name, KEYBOARD_WIDTH - 3, y + rowHeight / 2);
      }
    }

    // --- 操作 ---
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect(); let clientX, clientY;
      if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; } else { clientX = e.clientX; clientY = e.clientY; }
      return { x: clientX - rect.left, y: clientY - rect.top, clientX: clientX, clientY: clientY };
    }

    function startDrag(e) {
      if (isRecording) return; 
      if (e.target === canvas) e.preventDefault();
      const pos = getPointerPos(e); const rowHeight = (canvas.height / noteRange) * scaleY; clickButton = e.button || 0;
      
      let clickedNote = null;
      for (let i = editableNotes.length - 1; i >= 0; i--) {
        const note = editableNotes[i];
        const noteX = KEYBOARD_WIDTH + note.x - scrollX;
        const noteY = canvas.height - (note.noteNumber - baseMinNote + 1) * rowHeight + scrollY;
        if (pos.x >= noteX && pos.x <= noteX + note.width && pos.y >= noteY && pos.y <= noteY + rowHeight) { clickedNote = note; break; }
      }

      isLongPressTriggered = false;
      if (e.touches && e.touches.length === 1) {
        longPressTimer = setTimeout(() => {
          isLongPressTriggered = true;
          if (navigator.vibrate) navigator.vibrate(50);
          
          if (clickedNote) {
            if (!selectedNotes.includes(clickedNote)) { selectedNotes = [clickedNote]; draw(); }
            showContextMenu(pos.clientX, pos.clientY, pos.x, pos.y);
          } else {
            isPanning = false; isSelecting = true; selectionStart = pos; selectionEnd = pos; draw();
          }
        }, 500); 
      }

      if (clickButton === 2) {
        if (clickedNote) {
          if (!selectedNotes.includes(clickedNote)) { selectedNotes = [clickedNote]; draw(); }
        } else {
          isPanning = true; panStartX = pos.x; panStartY = pos.y; panStartScrollX = scrollX; panStartScrollY = scrollY; hasMoved = false;
        }
        showContextMenu(e.clientX, e.clientY, pos.x, pos.y);
        return;
      }

      if (clickButton === 0 && editMode === "pen") {
        if (pos.x > KEYBOARD_WIDTH) { 
          pushHistory(); let noteX = getSnappedX(pos.x - KEYBOARD_WIDTH + scrollX); 
          const noteNum = Math.floor((canvas.height - pos.y + scrollY) / rowHeight) + baseMinNote;
          const newNote = { x: Math.max(0, noteX), width: GRID_SIZE, noteNumber: Math.max(0, Math.min(127, noteNum)) };
          editableNotes.push(newNote); selectedNotes = [newNote]; draggingNote = newNote; isCreatingNote = true; draw();
        }
        return;
      }

      if (clickedNote) {
        if (e.ctrlKey || e.metaKey) {
          if (selectedNotes.includes(clickedNote)) { selectedNotes = selectedNotes.filter(n => n !== clickedNote); draggingNote = null; draw(); return; } 
          else { selectedNotes.push(clickedNote); }
        } else { if (!selectedNotes.includes(clickedNote)) selectedNotes = [clickedNote]; }
        draggingNote = clickedNote; dragOffsetX = pos.x - (KEYBOARD_WIDTH + clickedNote.x - scrollX);
        selectedNotes.forEach(n => { n._startX = n.x; n._startNoteNum = n.noteNumber; }); initialNotesState = JSON.stringify(editableNotes); draw();
      } else {
        panStartX = pos.x; panStartY = pos.y; panStartScrollX = scrollX; panStartScrollY = scrollY; hasMoved = false;
        if (e.touches) isPanning = true; 
        else { isSelecting = true; selectionStart = pos; selectionEnd = pos; if (!(e.ctrlKey || e.metaKey)) selectedNotes = []; }
        draw();
      }
    }

    function doDrag(e) {
      const pos = getPointerPos(e); const rowHeight = (canvas.height / noteRange) * scaleY;
      
      if (e.touches && !isLongPressTriggered) {
        if (Math.abs(pos.x - panStartX) > 10 || Math.abs(pos.y - panStartY) > 10) clearTimeout(longPressTimer);
      }

      if (isCreatingNote && draggingNote) {
        e.preventDefault(); let endX = getSnappedX(pos.x - KEYBOARD_WIDTH + scrollX); draggingNote.width = Math.max(GRID_SIZE / 2, endX - draggingNote.x); draw(); return;
      }
      if (!isSelecting && !draggingNote && !isPanning) {
        if (!isRecording && e.target === canvas) {
          let found = null;
          for (let i = editableNotes.length - 1; i >= 0; i--) {
            const note = editableNotes[i]; const noteX = KEYBOARD_WIDTH + note.x - scrollX; const noteY = canvas.height - (note.noteNumber - baseMinNote + 1) * rowHeight + scrollY;
            if (pos.x >= noteX && pos.x <= noteX + note.width && pos.y >= noteY && pos.y <= noteY + rowHeight) { found = note; break; }
          }
          if (hoveredNote !== found) { hoveredNote = found; draw(); }
        }
        return;
      }
      e.preventDefault(); 
      if (Math.abs(pos.x - panStartX) > 5 || Math.abs(pos.y - panStartY) > 5) { hasMoved = true; contextMenu.style.display = "none"; }
      
      if (isSelecting) {
        selectionEnd = pos;
        const rectX1 = Math.min(selectionStart.x, selectionEnd.x); const rectX2 = Math.max(selectionStart.x, selectionEnd.x);
        const rectY1 = Math.min(selectionStart.y, selectionEnd.y); const rectY2 = Math.max(selectionStart.y, selectionEnd.y);
        selectedNotes = editableNotes.filter(note => {
          const noteX = KEYBOARD_WIDTH + note.x - scrollX; const noteY = canvas.height - (note.noteNumber - baseMinNote + 1) * rowHeight + scrollY;
          return !(noteX > rectX2 || noteX + note.width < rectX1 || noteY > rectY2 || noteY + rowHeight < rectY1);
        });
        draw(); return;
      }
      if (draggingNote) {
        let rawX = pos.x - dragOffsetX - KEYBOARD_WIDTH + scrollX; const snappedHead = getSnappedX(rawX); let finalDeltaX = snappedHead - draggingNote._startX;
        if (snappedHead === rawX) { const rawEndX = rawX + draggingNote.width; const snappedTail = getSnappedX(rawEndX); if (snappedTail !== rawEndX) finalDeltaX = snappedTail - draggingNote.width - draggingNote._startX; }
        const newNoteNum = Math.floor((canvas.height - pos.y + scrollY) / rowHeight) + baseMinNote; const deltaNoteNum = newNoteNum - draggingNote._startNoteNum;
        selectedNotes.forEach(n => { n.x = Math.max(0, n._startX + finalDeltaX); n.noteNumber = Math.max(0, Math.min(127, n._startNoteNum + deltaNoteNum)); });
        draw();
      } else if (isPanning && hasMoved) {
        scrollX = Math.max(0, panStartScrollX - (pos.x - panStartX)); scrollY = panStartScrollY - (pos.y - panStartY);
        const newRowHeight = (canvas.height / noteRange) * scaleY; const maxY = (127 - baseMinNote + 2) * newRowHeight - canvas.height; const minY = -(baseMinNote + 1) * newRowHeight;
        if (scrollY > maxY) scrollY = maxY; if (scrollY < minY) scrollY = minY;
        draw();
      }
    }

    function endDrag(e) {
      clearTimeout(longPressTimer);
      
      if (isLongPressTriggered && isSelecting) {
        isSelecting = false;
        let clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX; let clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
        showContextMenu(clientX, clientY, selectionEnd.x, selectionEnd.y); draw();
        isLongPressTriggered = false; return;
      }
      isLongPressTriggered = false;

      if (isCreatingNote) { isCreatingNote = false; draggingNote = null; saveData(); draw(); return; }
      if (isSelecting) { 
        isSelecting = false; 
        if (!hasMoved && clickButton === 0) { playheadX = Math.max(0, selectionStart.x + scrollX - KEYBOARD_WIDTH); if (isPlaying && !isPaused) startPlaybackFrom(playheadX); else stopPlayback(); selectedNotes = []; }
        draw(); return; 
      }
      if (!draggingNote && isPanning && !hasMoved && clickButton === 0) {
        playheadX = Math.max(0, panStartX + scrollX - KEYBOARD_WIDTH); if (isPlaying && !isPaused) startPlaybackFrom(playheadX); else stopPlayback();
      }
      if (draggingNote) {
        if (initialNotesState !== JSON.stringify(editableNotes)) { undoStack.push(initialNotesState); redoStack = []; saveData(); }
        draggingNote = null;
      }
      isPanning = false; draw();
    }

    canvas.addEventListener("mouseleave", () => { hoveredNote = null; draw(); });
    canvas.addEventListener("mousedown", startDrag); window.addEventListener("mousemove", doDrag); window.addEventListener("mouseup", endDrag);
    canvas.addEventListener("touchstart", startDrag, { passive: false }); window.addEventListener("touchmove", doDrag, { passive: false }); window.addEventListener("touchend", endDrag);

    loadData(); resizeCanvas(); 
  </script>
</body>
